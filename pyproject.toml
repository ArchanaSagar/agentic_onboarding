[tool.poetry]
name = "agentic-onboarding"
version = "0.1.0"
description = "AI-powered project onboarding agent using LangGraph"
authors = ["Mahsa Alipour Charandabi <mahsa.alipourcharandabi@nttdata.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
langgraph = "^1.0.3"
langchain = "^1.0.5"
langchain-openai = "^1.0.2"
python-dotenv = "^1.2.1"
langchain-community = "^0.4.1"
beautifulsoup4 = "^4.14.2"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
